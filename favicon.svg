<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f18" />
      <stop offset="100%" stop-color="#040806" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Highlight Gradient -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Soft drop shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Inner Decorative Border -->
  <rect x="8" y="8" width="84" height="84" rx="20" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Ceramic Tile Grid Group (4 Tiles with precision 45-degree corner) -->
  <g filter="url(#glow)" transform="translate(20, 20)">
    <!-- Top-Left Tile -->
    <rect x="0" y="0" width="27" height="27" rx="5" fill="url(#emeraldGrad)" />

    <!-- Top-Right Tile (With 45° angle mitered corner) -->
    <path d="M33,0 L52,0 C56.4,0 60,3.6 60,8 L60,27 L33,27 Z" fill="url(#shineGrad)" />
    <!-- Sparkle star on top-right tile -->
    <path d="M48,7 L49.5,12 L54.5,13.5 L49.5,15 L48,20 L46.5,15 L41.5,13.5 L46.5,12 Z" fill="#ffffff" opacity="0.95" />

    <!-- Bottom-Left Tile -->
    <rect x="0" y="33" width="27" height="27" rx="5" fill="url(#emeraldGrad)" opacity="0.9" />

    <!-- Bottom-Right Tile -->
    <rect x="33" y="33" width="27" height="27" rx="5" fill="url(#emeraldGrad)" />

    <!-- Center Laser Crosshair Dot (Symbol of accuracy and laser level) -->
    <circle cx="30" cy="30" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="30" cy="30" r="5" fill="none" stroke="#34d399" stroke-width="1.2" opacity="0.75"/>
  </g>
</svg>
